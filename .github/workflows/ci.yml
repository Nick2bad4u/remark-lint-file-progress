name: "Continuous Integration"
on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:
    merge_group:
        types:
            - "checks_requested"
permissions:
    contents: "read"
concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true
jobs:
    test:
        name: "Test (${{ matrix.os }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 45
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Harden runner"
              if: "runner.os == 'Linux'"
              uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              name: "Run actions/checkout"
            - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - name: "Install declared npm and dependencies"
              run: |
                  npm ci
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run build && npm run typecheck"
              name: "Run npm run build && npm run typecheck"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run test:coverage:ci"
              name: "Run npm run test:coverage:ci"
              shell: "bash"
              timeout-minutes: 40
            - name: "Verify minimum Node and packed consumers on Windows"
              if: "runner.os == 'Windows'"
              run: "npm run test:compat:minimum"
              timeout-minutes: 15
            - name: "Upload coverage"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  files: "coverage/lcov.info"
                  flags: "${{ runner.os }}"
                  fail_ci_if_error: true
                  disable_search: true
            - name: "Upload test results"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  files: "test-report.junit.xml"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
            - name: "Retain coverage, test, and consumer evidence"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "verification-${{ runner.os }}"
                  path: |
                      coverage/coverage-summary.json
                      coverage/lcov.info
                      test-report.junit.xml
                      reports/*.json
                  retention-days: 30
    verify:
        name: "Quality, docs, and package compatibility"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        steps:
            - uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"
              name: "Run step-security/harden-runner"
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
              name: "Run actions/checkout"
            - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - name: "Install tooling"
              run: |
                  npm ci
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              shell: "bash"
              timeout-minutes: 40
            - run: |
                  mkdir -p reports
                  npm run release:verify 2>&1 | tee reports/release-verification.log
              name: "Run npm run release:verify"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run test:compat:minimum"
              name: "Test the advertised Node minimum"
              shell: "bash"
              timeout-minutes: 40
            - name: "Audit installed dependencies"
              run: "npm audit --audit-level=low"
              shell: "bash"
              timeout-minutes: 5
            - name: "Analyze with Sonar and wait for its quality gate"
              if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
              uses: "SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f" # v8.2.1
              env:
                  SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
            - name: "Retain quality and package verification evidence"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "quality-verification"
                  path: |
                      reports/
                      coverage/coverage-summary.json
                      docs/docusaurus/site-docs/developer/api/coverage.json
                  retention-days: 30
run-name: "Continuous Integration • ${{ github.ref_name }}"
