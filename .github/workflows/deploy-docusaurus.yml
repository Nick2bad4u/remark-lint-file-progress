name: "Deploy Docusaurus to GitHub Pages"
on:
    push:
        branches: ["main"]
    workflow_dispatch:
permissions:
    contents: "read"
concurrency:
    group: "pages"
    # Finish validated production deployments before starting the next one.
    cancel-in-progress: "${{ false }}"
jobs:
    build:
        name: "Build"
        permissions:
            contents: "read"
            pages: "read"
        runs-on: "ubuntu-latest"
        timeout-minutes: 40
        steps:
            - uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"
              name: "Run step-security/harden-runner"
            - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
              name: "Run actions/checkout"
            - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - run: "npm ci"
              name: "Install locked dependencies"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run docs:build && npm run docs:check-links"
              name: "Run npm run docs:build && npm run docs:check-links"
              shell: "bash"
              timeout-minutes: 40
            - uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d" # v6.0.0
              name: "Run actions/configure-pages"
            - uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
              with:
                  path: "docs/docusaurus/build"
              name: "Run actions/upload-pages-artifact"
    deploy:
        name: "Deploy"
        runs-on: "ubuntu-latest"
        needs: "build"
        permissions:
            pages: "write"
            id-token: "write"
        environment:
            name: "github-pages"
            url: "${{ steps.deployment.outputs.page_url }}"
        steps:
            - uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
              id: "deployment"
              name: "Run actions/deploy-pages"
        timeout-minutes: 60
run-name: "Deploy Docusaurus to GitHub Pages • ${{ github.ref_name }}"
